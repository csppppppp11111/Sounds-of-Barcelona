<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sounds of Barcelona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1 class="titulo">SOUNDS OF BARCELONA</h1>

  <button class="som" id="botaoSom">&#9675; SOUND OFF</button>

  <canvas id="tela"></canvas>

  <div class="info">
    <p class="descricao" id="descricao"></p>
    <p class="rua" id="rua"></p>
    <p class="agora" id="agora"></p>
  </div>

  <button class="adicionar" id="botaoAdicionar">+ ADD YOUR SOUND</button>

  <div class="painel" id="painel" hidden>
    <p class="painel-titulo">ADD A SOUND OF BARCELONA</p>

    <p class="etiqueta">1 · RECORDING</p>
    <label class="botao-linha">
      CHOOSE FILE
      <input type="file" id="campoFicheiro" accept="audio/*" hidden>
    </label>
    <span class="valor" id="nomeFicheiro">NO FILE CHOSEN</span>

    <p class="etiqueta">2 · WHERE IN BARCELONA?</p>
    <div class="linha-procura">
      <input class="campo" id="campoLocal" type="text"
             placeholder="CARRER DE MALLORCA 401" autocomplete="off" spellcheck="false">
      <button class="botao-linha" id="botaoProcurar" type="button">FIND</button>
    </div>
    <button class="botao-linha" id="botaoGPS" type="button">OR USE MY LOCATION</button>
    <p class="mensagem" id="mensagem"></p>

    <p class="etiqueta">3 · WHEN?</p>
    <input class="campo" id="campoData" type="date">

    <p class="etiqueta">4 · WHAT CAN WE HEAR?</p>
    <input class="campo" id="campoDescricao" type="text" maxlength="80"
           placeholder="FISH SELLERS AT LA BOQUERIA" autocomplete="off">

    <p class="creditos">STREET SEARCH &copy; OPENSTREETMAP CONTRIBUTORS</p>

    <div class="acoes">
      <button class="botao-linha" id="botaoCancelar" type="button">CANCEL</button>
      <button class="botao-linha principal" id="botaoConfirmar" type="button" disabled>ADD</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
